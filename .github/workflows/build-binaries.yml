name: Build PyRefine Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - feature/multi-platform-build

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: |
          python commands/build_exe/build_exe.py
          echo "PYREFINE_VERSION=$(python -c \"import json, pathlib; path=pathlib.Path('release/manifest.json'); print(json.loads(path.read_text())['version'])\")" >> $GITHUB_ENV

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Rename-Item -Path "dist/pyrefine.exe" -NewName ("pyrefine_" + $env:PYREFINE_VERSION + ".exe")

      - name: Rename artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/pyrefine "dist/pyrefine_linux_${{ env.PYREFINE_VERSION }}"

      - name: Rename artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mv dist/pyrefine "dist/pyrefine_macos_${{ env.PYREFINE_VERSION }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyrefine-${{ matrix.os }}
          path: |
            dist/*
