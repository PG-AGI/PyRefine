name: Build PyRefine Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - feature/multi-platform-build

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: |
          python commands/build_exe/build_exe.py

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Rename-Item -Path "dist/pyrefine.exe" -NewName "pyrefine-windows.exe"

      - name: Rename artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mv dist/pyrefine dist/pyrefine-linux

      - name: Rename artifact (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mv dist/pyrefine dist/pyrefine-macos

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyrefine-${{ matrix.os }}
          path: |
            dist/*

